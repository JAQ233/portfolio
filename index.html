        * {

            overflow-x: hidden;
            color: #f0f0f0;
        }

        /* 动态渐变背景 */
        .bg-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(30, 25, 55, 0.9), #0a0c12 70%);
        }
        .bg-aura::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle, rgba(212, 175, 122, 0.08) 0%, transparent 60%);
            animation: slowRotate 28s infinite linear;
        }
        @keyframes slowRotate {
            0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: rotate(5deg) scale(1.1); opacity: 0.8; }
            100% { transform: rotate(0deg) scale(1); opacity: 0.5; }
        }

        /* 跟随鼠标的光晕 */
        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,175,122,0.12) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem;
        }

        /* 头部区域 */
        .hero {
            text-align: center;
            margin-bottom: 5rem;
            padding: 2rem 0;
        }
        .hero-badge {
            display: inline-block;
            background: rgba(212, 175, 122, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 122, 0.4);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 3px;
            font-weight: 500;
            margin-bottom: 1.8rem;
            animation: fadeDown 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f5e7c8 0%, #d4af7a 40%, #f5e7c8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            animation: fadeUp 0.9s ease;
        }
        .hero p {
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 550px;
            margin: 1.2rem auto 0;
            opacity: 0.7;
            border-top: 1px solid rgba(255,255,255,0.15);
            display: inline-block;
            padding-top: 1rem;
            animation: fadeUp 1s ease;
        }

        /* 网格布局 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2.8rem;
        }

        /* 分段标题样式 */
        .section-break {
            grid-column: 1 / -1;
            text-align: center;
            margin: 3rem 0 1rem;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(212, 175, 122, 0.3);
            border-bottom: 1px solid rgba(212, 175, 122, 0.3);
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
            color: #d4af7a;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }
        .section-desc {
            font-size: 0.9rem;
            color: #a0a0b0;
            letter-spacing: 1px;
        }

        /* 卡片 */
        .card {
            background: rgba(18, 20, 28, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 122, 0.25);
            transition: all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            opacity: 0;
            transform: translateY(50px);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
        }
        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .card:hover {
            transform: translateY(-12px) scale(1.01);
            border-color: rgba(212, 175, 122, 0.7);
            box-shadow: 0 30px 50px -15px rgba(0,0,0,0.6);
        }

        /* 媒体容器 */
        .media-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #0f0f17;
            cursor: pointer;
        }
        .media-wrapper img,
        .media-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: block;
        }
        
        /* 关键：封面图在上层，视频在下层 */
        .media-wrapper .poster-img {
            position: relative;
            z-index: 2;
            transition: opacity 0.25s ease;
        }
        .media-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 1;
            width: 100%;
            height: 100%;
        }
        .media-wrapper.video-playing .poster-img {
            opacity: 0;
            visibility: hidden;
        }

    const gallery = document.getElementById('galleryContainer');
    
    function buildCards() {
        gallery.innerHTML = '';
        portfolioItems.forEach((item, idx) => {
            // 如果是分段类型
            if (item.type === 'section') {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section-break';
                sectionDiv.innerHTML = `
                    <div class="section-title">${item.title || ''}</div>
                    ${item.description ? `<div class="section-desc">${item.description}</div>` : ''}
                `;
                gallery.appendChild(sectionDiv);
                return;
            }
            
            // 卡片渲染
            const card = document.createElement('div');
            card.className = 'card';
            card.style.transitionDelay = (idx * 0.08) + 's';
            
            let mediaHtml = '';
            if (item.type === 'video') {
                mediaHtml = `
                    <div class="media-wrapper" data-video-index="${idx}">
                        <img class="poster-img" src="${item.poster}" alt="${item.title}" onerror="this.src='https://placehold.co/800x600/1e1e2a/d4af7a?text=Poster+Missing'">
                        <video loop muted playsinline preload="none">
                            <source src="${item.src}" type="video/mp4">
                            您的浏览器不支持视频播放
                        </video>
                        <div class="video-badge">
                            <i class="fas fa-play-circle"></i> 悬停播放
                        </div>
                    </div>
                `;
            } else if (item.type === 'hover-image') {
                mediaHtml = `
                    <div class="media-wrapper img2-wrapper">
                        <div class="img2-wrapper">
                            <img class="default-img" src="${item.defaultImg}" alt="${item.title}">
                            <img class="hover-img" src="${item.hoverImg}" alt="${item.title} hover">
                        </div>
                    </div>
                `;
            } else {
                mediaHtml = `
                    <div class="media-wrapper">
                        <img src="${item.src}" alt="${item.title}" onerror="this.src='https://placehold.co/800x600/1e1e2a/d4af7a?text=Image+Not+Found'">
                    </div>
                `;
            }
            
            card.innerHTML = `
                ${mediaHtml}
                <div class="card-content">
                    <div class="card-category">
                        <i class="fas fa-gem"></i> ${item.category}
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.description}</div>
                    <div class="tag-list">
                        ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                </div>
            `;
            gallery.appendChild(card);
        });
        
        // 绑定图片悬停切换效果
        document.querySelectorAll('.media-wrapper.img2-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', () => {
                wrapper.classList.add('img2-active');
            });
            wrapper.addEventListener('mouseleave', () => {
                wrapper.classList.remove('img2-active');
            });
        });
        
        // 绑定视频悬停效果
        document.querySelectorAll('.media-wrapper').forEach(wrapper => {
            const video = wrapper.querySelector('video');
            if (!video) return;
            
            wrapper.addEventListener('mouseenter', () => {
                wrapper.classList.add('video-playing');
                video.currentTime = 0;
                video.play().catch(e => console.log("自动播放需要用户交互"));
            });
            
            wrapper.addEventListener('mouseleave', () => {
                if (!video.paused) {
                    video.pause();
                }
                video.currentTime = 0;
                wrapper.classList.remove('video-playing');
            });
        });
        
        // 滚动动画
        const cards = document.querySelectorAll('.card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2, rootMargin: "0px 0px -30px 0px" });
        
        cards.forEach(card => observer.observe(card));
        
        setTimeout(() => {
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                if (rect.top < window.innerHeight - 80) {
                    card.classList.add('visible');
                }
            });
        }, 100);
    }

    buildCards();

    // 鼠标跟随光晕
    const glow = document.getElementById('mouseGlow');
    document.addEventListener('mousemove', (e) => {
        if (glow) {
            glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        }
    });
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script>
    // 点击卡片跳转详情页
    document.querySelectorAll('.card').forEach((card, index) => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', (e) => {
            if (e.target.closest('.video-badge')) return;
            
            // 获取对应的作品数据
            let currentItem = null;
            let itemIndex = 0;
            for (let i = 0; i < portfolioItems.length; i++) {
                const item = portfolioItems[i];
                if (item.type === 'section') continue;
                if (itemIndex === index) {
                    currentItem = item;
                    break;
                }
                itemIndex++;
            }
            
            let images = [];
            let title = '';
            let desc = '';
            
            if (currentItem) {
                title = currentItem.title || '作品详情';
                desc = currentItem.description || '';
                
                // 优先使用 detailImages
                if (currentItem.detailImages && currentItem.detailImages.length >= 3) {
                    images = currentItem.detailImages.slice(0, 3);
                } else {
                    // 否则从卡片中提取
                    const defaultImg = card.querySelector('.default-img')?.src;
                    const hoverImg = card.querySelector('.hover-img')?.src;
                    const posterImg = card.querySelector('.poster-img')?.src;
                    
                    if (defaultImg) images.push(defaultImg);
                    if (hoverImg) images.push(hoverImg);
                    if (posterImg && !defaultImg) images.push(posterImg);
                    
                    const mainImg = card.querySelector('img')?.src;
                    if (images.length === 0 && mainImg) images.push(mainImg);
                    while (images.length < 3) images.push(images[0]);
                }
            } else {
                // 备用方案
                title = card.querySelector('.card-title')?.innerText || '作品详情';
                desc = card.querySelector('.card-desc')?.innerText || '';
                const defaultImg = card.querySelector('.default-img')?.src;
                const hoverImg = card.querySelector('.hover-img')?.src;
                if (defaultImg) images.push(defaultImg);
                if (hoverImg) images.push(hoverImg);
                while (images.length < 3) images.push(images[0] || '');
            }
            
            const params = new URLSearchParams({
                images: JSON.stringify(images.slice(0, 3)),
                title: title,
                desc: desc
            });
            window.location.href = `detail.html?${params.toString()}`;
        });
    });
</script>
